name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - run: bun run test
      - run: bun test --timeout 15000 packages/butler-ui/provider/openai-native
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -p 'test_seedmux*.py'
