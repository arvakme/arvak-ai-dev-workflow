<style>
  :root {
    --bg: #F2EFE6;
    --surface: #E7E3D5;
    --card: #FBFAF4;
    --ink: #20261F;
    --ink-soft: #71766B;
    --line: rgba(32, 38, 31, .1);
    --accent: #3E7A5E;
    --accent-deep: #2C5E47;
    --warn: #BE5560;
    --navw: clamp(195px, 15vw, 235px);
    --asidew: clamp(300px, 26vw, 420px);
    --mono: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
    --sans: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    --serif: "Georgia", "Songti SC", serif;
    --shadow-float: 0 0 0 1px oklch(0 0 0 / .07), 0 1px 2px -1px oklch(0 0 0 / .07), 0 3px 8px -2px oklch(0 0 0 / .07);
    --ease-state: cubic-bezier(.2, 0, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 12.5px/1.65 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ic { width: 13px; height: 13px; flex-shrink: 0; vertical-align: -2px; }
  .isw { position: relative; display: inline-flex; flex-shrink: 0; }
  .isw .if { position: absolute; inset: 0; opacity: 0; }
  .on .isw .if, .sel .isw .if { opacity: 1; }
  .on .isw .io, .sel .isw .io { opacity: 0; }
  header { display: flex; align-items: center; gap: 15px; padding: 12px 16px 5px; }
  header .ops { display: flex; align-items: center; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img, .brand svg.logo { width: 28px; height: 28px; }
  .brand .v { font: 700 15px var(--serif); white-space: nowrap; }
  .statbar {
    display: flex; align-items: center; gap: 13px; height: 32px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 0 14px;
  }
  .statbar .stat { display: flex; align-items: baseline; gap: 5px; }
  .statbar .stat .ic { width: 12px; height: 12px; color: var(--accent-deep); align-self: center; }
  .statbar .k { font-size: 10.5px; color: var(--ink-soft); }
  .statbar .v { font: 700 13px var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .statbar .sep { width: 1px; height: 12px; background: var(--line); align-self: center; }
  header .spacer { flex: 1; }
  header button {
    display: flex; align-items: center; gap: 6px; height: 32px;
    font: 600 12px var(--sans); cursor: pointer; border-radius: 10px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 0 14px;
    transition: background .15s, color .15s, scale .16s var(--ease-state);
  }
  header button.primary { background: var(--accent); color: #FFF; border-color: transparent; }
  header button.primary:hover { background: var(--accent-deep); }
  header button:not(.primary):hover { background: var(--surface); }
  header button:active { scale: .96; }
  header button.vitals-btn {
    --hc: var(--ink-soft);
    background: color-mix(in srgb, var(--hc) 10%, transparent); border-color: transparent;
  }
  header button.vitals-btn:hover { background: color-mix(in srgb, var(--hc) 18%, transparent); }
  header button.vitals-btn .ic { color: var(--hc); }
  header button.vitals-btn .score { font: 700 12px var(--mono); color: var(--hc); font-variant-numeric: tabular-nums; }
  .proto {
    font: 600 10.5px var(--sans); letter-spacing: .04em; color: var(--ink-soft);
    border: 1px dashed color-mix(in srgb, var(--ink) 22%, transparent);
    border-radius: 8px; padding: 3px 8px; white-space: nowrap;
  }
  dialog#healthDlg {
    border: none; padding: 0; background: none; overflow: visible;
    width: 100%; height: 100%; max-width: 100%; max-height: 100%;
  }
  dialog#healthDlg[open] { display: flex; align-items: center; justify-content: center; }
  dialog#healthDlg::backdrop { background: rgba(32, 38, 31, .4); }
  .hmodal {
    width: min(860px, 92vw); max-height: 84vh; overflow-y: auto;
    background: var(--card); border-radius: 18px;
    padding: 18px 24px 26px; box-shadow: var(--shadow-float), 0 20px 60px rgba(20, 20, 19, .24);
  }
  .hmodal .hclose {
    position: sticky; top: 0; float: right; margin: -4px -8px 0 0;
    width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer;
  }
  .hmodal .hhead {
    display: flex; align-items: center; gap: 9px;
    font: 700 19px/1.3 var(--serif); margin: 0 0 14px;
  }
  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px 12px 12px; position: relative; }
  .handle {
    position: fixed; z-index: 30; top: 50%; transform: translateY(-50%);
    width: 24px; height: 48px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); cursor: pointer; color: var(--ink-soft);
  }
  #handleNav { left: calc(12px + var(--navw) - 1px); border-left: none; border-radius: 0 24px 24px 0; }
  body.nav-off #handleNav { left: 0; }
  body.nav-off #handleNav .ic { transform: rotate(180deg); }
  #handleAside { right: calc(12px + var(--asidew) - 1px); border-right: none; border-radius: 24px 0 0 24px; }
  #handleAside .ic { transform: rotate(180deg); }
  body.aside-off #handleAside { right: 0; }
  body.aside-off #handleAside .ic { transform: rotate(0deg); }
  nav, #stage, aside { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  nav {
    width: var(--navw); overflow-y: auto; padding: 8px 8px 20px; flex-shrink: 0;
    transition: margin .24s var(--ease-state), opacity .18s ease-out;
  }
  aside { width: var(--asidew); display: flex; flex-direction: column; flex-shrink: 0;
    transition: margin .24s var(--ease-state), opacity .18s ease-out; }
  body.nav-off nav { margin-left: calc(-1 * var(--navw) - 10px); opacity: 0; pointer-events: none; }
  body.aside-off aside { margin-right: calc(-1 * var(--asidew) - 10px); opacity: 0; pointer-events: none; }
  nav .filter { position: sticky; top: 0; background: var(--card); padding: 2px 2px 8px; z-index: 2; }
  nav .filter input {
    width: 100%; font: 12px var(--sans); padding: 6px 10px 6px 30px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
  }
  nav .filter .sbox { position: relative; }
  nav .filter .sic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
  nav .grp {
    display: flex; align-items: center; gap: 7px;
    font: 700 10.5px var(--mono); letter-spacing: .1em;
    margin: 12px 4px 4px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  nav .grp .ct { margin-left: auto; font-weight: 400; letter-spacing: 0; }
  nav .item {
    display: flex; gap: 8px; align-items: center; padding: 5.5px 9px; margin: 2px 0;
    cursor: pointer; border-radius: 8px; line-height: 1.4;
  }
  nav .item:hover { background: var(--surface); }
  nav .item.sel { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent-deep); }
  nav .item.hid { display: none; }
  nav .code {
    font: 700 10.5px var(--mono); border: 1px solid var(--line); border-radius: 5px;
    padding: 0 4px; min-width: 26px; text-align: center; background: var(--bg); flex-shrink: 0;
  }
  nav .hdot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; touch-action: none; background: #F2EFE6; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #label-layer { position: absolute; inset: 0; pointer-events: none; }
  #flowbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; background: var(--card);
    border-radius: 12px; padding: 3px; z-index: 5; max-width: 86%; overflow-x: auto;
    box-shadow: var(--shadow-float);
  }
  #flowbar button {
    font: 600 11.5px var(--sans); border: 1px solid transparent; background: none;
    color: var(--ink-soft); padding: 5px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  #flowbar button.on { color: #FFF; background: var(--accent); }
  #hint {
    position: absolute; left: 12px; bottom: 12px; z-index: 4;
    font: 600 11px var(--sans); color: var(--ink-soft);
    background: color-mix(in srgb, var(--card) 86%, transparent);
    border-radius: 8px; padding: 4px 8px; pointer-events: none;
  }
  #legend {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 4;
    display: flex; align-items: center; gap: 22px;
    font: 600 11px var(--sans); color: var(--ink-soft); pointer-events: none;
  }
  #legend span { display: flex; align-items: center; gap: 7px; }
  .tabs { position: relative; display: flex; gap: 4px; margin: 10px 12px 0; background: var(--surface); border-radius: 11px; padding: 3px; }
  .tabs button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 600 12.5px var(--sans); padding: 7px 0; border-radius: 8px;
    background: none; color: var(--ink-soft); border: 1px solid transparent; cursor: pointer;
  }
  .tabs button.on { color: var(--ink); background: var(--card); border-color: var(--line); }
  #panel { flex: 1; overflow-y: auto; padding: 16px 20px 30px; text-wrap: pretty; }
  #panel .kicker { display: flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: .15em; color: var(--ink-soft); }
  #panel h2 { font: 700 18px/1.4 var(--serif); margin: 6px 0 12px; text-wrap: balance; }
  #panel h3 { font-size: 11px; letter-spacing: .13em; color: var(--ink-soft); margin: 18px 0 7px; }
  #panel p { font: 13.5px/1.75 var(--sans); margin-bottom: 11px; }
  #panel code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  #panel ul { list-style: none; padding: 0; }
  #panel li { font-size: 12px; margin: 4px 0; }
  #panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
  #panel .chip {
    font: 600 11px var(--sans); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; cursor: pointer;
  }
  #panel .chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  #panel .chip.hchip { background: color-mix(in srgb, var(--warn) 7%, transparent); border-color: color-mix(in srgb, var(--warn) 28%, transparent); color: var(--warn); }
  #panel .src { cursor: pointer; }
  #panel .steps li {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 8px; margin: 1px -8px; border-radius: 8px; cursor: pointer;
  }
  #panel .steps li:hover { background: var(--surface); }
  #panel .steps li.now { color: var(--accent-deep); font-weight: 700; }
  #panel .steps li .no { font: 700 10.5px var(--mono); color: var(--ink-soft); min-width: 15px; }
  #panel .md-body h2 { font: 700 13px/1.5 var(--sans); letter-spacing: .01em; margin: 20px 0 8px; }
  #panel .md-body h3 { font: 700 12px var(--sans); color: var(--ink); margin: 12px 0 6px; letter-spacing: 0; }
  #panel .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body li { font: 12.5px/1.7 var(--sans); }
  #panel .md-body pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 11px; }
  #panel .wl { cursor: pointer; text-decoration: underline dotted; color: var(--accent-deep); }
  .vitals {
    display: flex; gap: 14px; align-items: center; margin: 2px 0 16px;
    background: color-mix(in srgb, var(--hc, var(--ink)) 8%, var(--card));
    border: 1px solid color-mix(in srgb, var(--hc, var(--ink)) 22%, transparent);
    border-radius: 14px; padding: 14px;
  }
  .gscore { font: 700 22px var(--mono); }
  .vstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .vstat { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 3px; text-align: center; }
  .vstat .vv { font: 700 14px var(--mono); }
  .vstat .vk { font-size: 10px; color: var(--ink-soft); }
  .nlabel {
    display: flex; align-items: center; gap: 4px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 2px 7px 2px 5px; font: 600 11px/1.15 var(--sans);
    white-space: nowrap; pointer-events: auto; cursor: pointer;
    box-shadow: var(--shadow-float);
    transform: translate(-50%, -20%);
    user-select: none;
  }
  .nlabel .ic { width: 11px; height: 11px; color: var(--ink-soft); }
  .nlabel .code {
    font: 700 10px var(--mono); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 4px; background: var(--bg);
  }
  .nlabel.sel { outline: 2px solid var(--accent); }
  .nlabel.dim { opacity: .38; }
  .dlabel {
    font: 700 10.5px var(--sans); letter-spacing: .12em; color: var(--ink-soft);
    pointer-events: none; transform: translate(-50%, -40%);
    white-space: nowrap; opacity: .85;
  }
  .hmodal .md-body { font: 12.5px/1.75 var(--sans); }
  .hmodal .md-body h2 { font: 700 13px/1.5 var(--sans); margin: 20px 0 8px; }
  .hmodal .md-body ul { list-style: disc; padding-left: 18px; }
  @media (prefers-reduced-motion: reduce) {
    nav, aside, header button { transition: none; }
  }
  @media (max-width: 1080px) {
    nav { position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; width: min(78vw, 320px); border-radius: 0 16px 16px 0; }
    aside { position: fixed; right: 0; top: 0; bottom: 0; z-index: 20; width: min(86vw, 420px); border-radius: 16px 0 0 16px; }
    #handleNav { left: 0; }
    #handleAside { right: 0; }
  }
</style>
</head>
